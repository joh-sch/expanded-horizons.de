title: Site

tabs:
  pages:
    label: Pages
    sections:
      pages:
        type: pages
        label: Pages
        layout: list

  info:
    label: Info Panel
    fields:
      tagline:
        type: text
        label: Tagline

      info:
        type: layout
        label: Info content
        layouts:
          - '1/1'
        fieldsets:
          - heading
          - text

      about:
        type: textarea
        label: About (legacy)
        buttons:
          - bold
          - italic
          - link
        help: Used only until Info content is populated.

      contact:
        type: textarea
        label: Contact (legacy)
        buttons:
          - bold
          - italic
          - link
        help: Used only until Info content is populated.

      credits:
        type: structure
        label: Credits
        fields:
          name:
            type: text
            label: Name
          subtitle:
            type: text
            label: Subtitle

      footerlinks:
        type: structure
        label: Footer links
        fields:
          label:
            type: text
            label: Label
          url:
            type: url
            label: URL
