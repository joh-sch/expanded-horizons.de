name:
  en: Logo grid
  de: Logo-Raster
icon: grid
tabs:
  content:
    label: Content
    fields:
      items:
        type: structure
        label: Items
        fields:
          img_logo:
            type: files
            label: Logo
            multiple: false
            width: 1/3
          link:
            type: link
            label: Link
            help: optional
            width: 1/3

  layout:
    label: Layout
    fields:
      marginBottomAmount:
        label: Bottom margin
        type: number
        min: 0
        step: 0.1
        default: 0
      marginBottomUnit:
        label: Unit
        type: select
        default: rem
        options:
          px: px
          rem: rem
          em: em
          "%": "%"
          vw: vw
          vh: vh
