label: Info Panel
fields:
  tagline:
    type: text
    label: Tagline

  info:
    type: layout
    label: Info content
    layouts:
      - "1/1"
    fieldsets:
      - heading
      - text
      - link
      - logo-grid
    settings:
      tabs:
        layout:
          label: Layout
          fields:
            marginBottomAmount:
              label: Bottom margin
              type: number
              min: 0
              step: 0.1
              default: 0
              width: 1/4
            marginBottomUnit:
              label: Unit
              type: select
              default: rem
              width: 1/4
              options:
                px: px
                rem: rem
                em: em
                "%": "%"
                vw: vw
                vh: vh
            flex:
              label: Flex
              type: toggle
              default: false
              width: 1/4
            flexDirection:
              label: Direction
              type: select
              default: row
              width: 1/4
              options:
                row: Row
                row-reverse: Row reverse
                col: Column
                col-reverse: Column reverse
              when:
                flex: true

  footerlinks:
    type: structure
    label: Footer links
    fields:
      label:
        type: text
        label: Label
      url:
        type: url
        label: URL
